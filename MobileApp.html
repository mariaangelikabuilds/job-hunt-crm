<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job CRM">
<meta name="theme-color" content="#2D5266">
<base target="_top">
<title>Job CRM</title>
<style>
  :root {
    --bg: #F8F8F6;
    --surface: #FFFFFF;
    --ink: #1F1F1F;
    --ink-muted: #5C5A56;
    --line: #E5E3DD;
    --accent: #2D5266;
    --accent-hover: #3D6B82;
    --good: #3D6B47;
    --warn: #B57F2E;
    --bad: #A23B26;
    --neutral: #6B6862;
    --radius: 4px;
    --space: 16px;
    --tab-bar-h: 64px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A1A;
      --surface: #2A2A2A;
      --ink: #F0EFEB;
      --ink-muted: #9C9A95;
      --line: #3A3A3A;
      --accent: #6B9FB5;
      --accent-hover: #8FB8C9;
      --good: #7DB386;
      --warn: #D4A24E;
      --bad: #D9745F;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    overscroll-behavior-y: none;
  }

  body {
    padding: 0 0 calc(var(--tab-bar-h) + env(safe-area-inset-bottom)) 0;
    min-height: 100dvh;
  }

  h1, h2, h3, h4 { margin: 0; font-weight: 600; }

  .scroll-area { padding: var(--space); }

  .top-header {
    padding: calc(env(safe-area-inset-top) + var(--space)) var(--space) var(--space) var(--space);
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .top-header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  .top-header .subtitle {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  section.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--space);
    margin-bottom: var(--space);
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  button {
    appearance: none;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    padding: 0 16px;
    height: 44px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    border-radius: var(--radius);
    cursor: pointer;
    width: 100%;
  }
  button:active { background: var(--accent); border-color: var(--accent); }
  button.secondary {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--line);
  }
  button.secondary:active { background: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: 0.6; }

  input[type="text"], input[type="url"], textarea, select {
    width: 100%;
    padding: 12px;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    appearance: none;
  }
  textarea {
    height: auto;
    min-height: 88px;
    resize: vertical;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    margin-top: 12px;
    margin-bottom: 4px;
  }

  .briefing {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .briefing .stat {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
  }
  .briefing .stat .num {
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .briefing .stat .num[data-good] { color: var(--good); }
  .briefing .stat .num[data-warn] { color: var(--warn); }
  .briefing .stat .label-text {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 6px;
  }

  .row-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .row-card .row-main { flex: 1; min-width: 0; }
  .row-card .company { font-weight: 600; font-size: 14px; }
  .row-card .role {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-card .meta {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
  }
  .row-card .score {
    font-size: 18px;
    font-weight: 600;
    margin-left: 12px;
    font-variant-numeric: tabular-nums;
  }
  .row-card .score[data-band="good"] { color: var(--good); }
  .row-card .score[data-band="warn"] { color: var(--warn); }
  .row-card .score[data-band="bad"]  { color: var(--neutral); }
  .row-card.swiping { transition: none; }
  .row-card[data-swipe-bg="applied"]::before {
    content: 'Mark applied';
    position: absolute;
    inset: 0;
    background: var(--good);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 16px;
    font-weight: 500;
    z-index: 0;
  }
  .row-card[data-swipe-bg="rejected"]::before {
    content: 'Mark rejected';
    position: absolute;
    inset: 0;
    background: var(--bad);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 16px;
    font-weight: 500;
    z-index: 0;
  }
  .row-card .row-content {
    position: relative;
    background: var(--surface);
    z-index: 1;
    width: 100%;
    display: flex;
    align-items: center;
    transition: transform 0.2s ease;
  }

  .pill {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-radius: 100px;
    color: var(--ink-muted);
    margin-right: 4px;
  }
  .pill[data-status="Applied"] { color: var(--accent); border-color: var(--accent); }
  .pill[data-status="Interview Scheduled"] { color: var(--good); border-color: var(--good); }
  .pill[data-status="Offer"] { color: var(--good); border-color: var(--good); }
  .pill[data-status="Rejected"] { color: var(--bad); border-color: var(--bad); }

  .empty-state {
    text-align: left;
    color: var(--ink-muted);
    padding: var(--space) 0;
    font-size: 14px;
  }
  .empty-state h3 { color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  .error {
    background: #F9E9E5;
    border: 1px solid var(--bad);
    color: var(--bad);
    padding: 12px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: var(--space);
  }

  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--tab-bar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface);
    border-top: 1px solid var(--line);
    display: flex;
    z-index: 10;
  }
  .tab-bar button {
    flex: 1;
    height: var(--tab-bar-h);
    background: transparent;
    border: 0;
    color: var(--ink-muted);
    font-size: 13px;
    font-weight: 500;
    border-radius: 0;
    width: auto;
    padding: 0;
  }
  .tab-bar button.active {
    color: var(--accent);
    border-top: 2px solid var(--accent);
  }

  .skeleton {
    background: linear-gradient(90deg, var(--line) 25%, #EFEDE7 50%, var(--line) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: var(--radius);
  }
  .skeleton.line { height: 14px; margin-bottom: 8px; }
  .skeleton.line.short { width: 60%; }
  .skeleton.block { height: 80px; margin-bottom: 8px; }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .toast {
    position: fixed;
    bottom: calc(var(--tab-bar-h) + 16px + env(safe-area-inset-bottom));
    left: 16px;
    right: 16px;
    background: var(--ink);
    color: var(--bg);
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    z-index: 20;
    transform: translateY(120%);
    transition: transform 0.2s ease;
  }
  .toast.show { transform: translateY(0); }
  .toast.error { background: var(--bad); }

  .form-group { margin-bottom: 12px; }

  .row-list { padding: 0; }

  .footer-meta {
    text-align: center;
    font-size: 11px;
    color: var(--ink-muted);
    padding: var(--space) 0;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <nav class="tab-bar" id="tabbar">
    <button data-tab="home">Home</button>
    <button data-tab="recent">Recent</button>
    <button data-tab="log">Log</button>
  </nav>

  <script>
    const $ = sel => document.querySelector(sel)
    const $$ = sel => Array.from(document.querySelectorAll(sel))

    const state = {
      tab: 'home',
      loading: true,
      error: null,
      briefing: null,
      rows: [],
      activeRow: null
    }

    function setState(patch) {
      Object.assign(state, patch)
      render()
    }

    function loadAll() {
      setState({ loading: true, error: null })
      google.script.run
        .withSuccessHandler(data => {
          setState({
            loading: false,
            briefing: data.briefing,
            rows: data.rows,
            error: null
          })
        })
        .withFailureHandler(err => setState({ loading: false, error: err.message || String(err) }))
        .getRecentApplicationsForMobile(50)
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return ''
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function band(score) {
      if (typeof score !== 'number') return 'bad'
      if (score >= 60) return 'good'
      if (score >= 40) return 'warn'
      return 'bad'
    }

    function showToast(msg, isError) {
      const t = $('#toast')
      t.textContent = msg
      t.classList.toggle('error', !!isError)
      t.classList.add('show')
      setTimeout(() => t.classList.remove('show'), 3000)
    }

    function renderHomeTab() {
      const b = state.briefing
      if (!b) return ''
      const followups = b.follow_ups || []
      const interviews = b.interviews || []

      return `
        <section class="card">
          <div class="section-label">Today</div>
          <div class="briefing">
            <div class="stat">
              <div class="num" ${b.follow_ups_due > 0 ? 'data-warn' : ''}>${b.follow_ups_due}</div>
              <div class="label-text">follow-up${b.follow_ups_due === 1 ? '' : 's'} due</div>
            </div>
            <div class="stat">
              <div class="num" ${b.interviews_this_week > 0 ? 'data-good' : ''}>${b.interviews_this_week}</div>
              <div class="label-text">interview${b.interviews_this_week === 1 ? '' : 's'} this week</div>
            </div>
          </div>
        </section>

        ${followups.length ? `
          <section class="card">
            <div class="section-label">Follow up</div>
            ${followups.map(r => renderRowCardCompact(r)).join('')}
          </section>
        ` : ''}

        ${interviews.length ? `
          <section class="card">
            <div class="section-label">Upcoming interviews</div>
            ${interviews.map(r => renderRowCardCompact(r)).join('')}
          </section>
        ` : ''}

        <div class="footer-meta">
          $${(b.monthly_spend_usd || 0).toFixed(4)} this month
        </div>
      `
    }

    function renderRowCardCompact(r) {
      return `
        <div class="row-card" data-row="${r.row}">
          <div class="row-content">
            <div class="row-main">
              <div class="company">${escapeHtml(r.company)}</div>
              <div class="role">${escapeHtml(r.role)}</div>
              <div class="meta">
                <span class="pill" data-status="${escapeHtml(r.status)}">${escapeHtml(r.status)}</span>
                ${r.last_touch ? 'last touch ' + new Date(r.last_touch).toLocaleDateString() : ''}
              </div>
            </div>
            ${typeof r.fit_score === 'number' ? `<div class="score" data-band="${band(r.fit_score)}">${r.fit_score}</div>` : ''}
          </div>
        </div>
      `
    }

    function renderRecentTab() {
      const rows = state.rows || []
      if (rows.length === 0) {
        return `
          <div class="empty-state">
            <h3>No applications yet</h3>
            <p>Tap Log to create your first one.</p>
          </div>
        `
      }
      return `
        <div class="row-list">
          ${rows.map(r => renderRowCardCompact(r)).join('')}
        </div>
        <div class="footer-meta">Swipe a card right to mark Applied, left to mark Rejected. Tap to score.</div>
      `
    }

    function renderLogTab() {
      return `
        <section class="card">
          <div class="section-label">Log a new application</div>
          <p style="font-size:12px;color:var(--ink-muted);margin-top:0">Captures Company, Role, JD link, and rough notes. Saves to the sheet immediately.</p>
          <form id="quick-log-form">
            <div class="form-group">
              <label for="ql-company">Company</label>
              <input type="text" id="ql-company" required autocomplete="off" autocapitalize="words">
            </div>
            <div class="form-group">
              <label for="ql-role">Role</label>
              <input type="text" id="ql-role" autocomplete="off" autocapitalize="words">
            </div>
            <div class="form-group">
              <label for="ql-jd">JD link</label>
              <input type="url" id="ql-jd" autocomplete="off" inputmode="url">
            </div>
            <div class="form-group">
              <label for="ql-status">Status</label>
              <select id="ql-status">
                <option value="Saved">Saved</option>
                <option value="Applied">Applied</option>
                <option value="Interview Scheduled">Interview Scheduled</option>
              </select>
            </div>
            <div class="form-group">
              <label for="ql-tags">Tags (comma-separated)</label>
              <input type="text" id="ql-tags" autocomplete="off" placeholder="dream-tier, remote-ph">
            </div>
            <div class="form-group">
              <label for="ql-notes">Notes</label>
              <textarea id="ql-notes" placeholder="Recruiter name, where you found it, gut reaction..." autocapitalize="sentences"></textarea>
            </div>
            <button type="submit">Save application</button>
          </form>
        </section>
      `
    }

    function render() {
      if (state.error) {
        $('#app').innerHTML = `
          <div class="top-header"><h1>Job CRM</h1></div>
          <div class="scroll-area">
            <div class="error">${escapeHtml(state.error)}</div>
            <button onclick="loadAll()">Try again</button>
          </div>
        `
        bindTabBar()
        return
      }

      if (state.loading) {
        $('#app').innerHTML = `
          <div class="top-header">
            <div class="skeleton line short"></div>
            <div class="skeleton line"></div>
          </div>
          <div class="scroll-area">
            <div class="skeleton block"></div>
            <div class="skeleton block"></div>
          </div>
        `
        bindTabBar()
        return
      }

      const headers = {
        home: { title: 'Today', subtitle: 'Job hunt at a glance' },
        recent: { title: 'Recent applications', subtitle: state.rows.length + ' tracked' },
        log: { title: 'Log application', subtitle: 'Quick entry from anywhere' }
      }
      const h = headers[state.tab]

      $('#app').innerHTML = `
        <div class="top-header">
          <h1>${escapeHtml(h.title)}</h1>
          <div class="subtitle">${escapeHtml(h.subtitle)}</div>
        </div>
        <div class="scroll-area">
          ${state.tab === 'home' ? renderHomeTab() : ''}
          ${state.tab === 'recent' ? renderRecentTab() : ''}
          ${state.tab === 'log' ? renderLogTab() : ''}
        </div>
      `

      bindTabBar()
      bindRowCards()
      bindQuickLogForm()
    }

    function bindTabBar() {
      $$('#tabbar button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.tab)
        btn.onclick = () => setState({ tab: btn.dataset.tab })
      })
    }

    function bindRowCards() {
      $$('.row-card').forEach(card => {
        const content = card.querySelector('.row-content')
        const row = parseInt(card.dataset.row, 10)
        let startX = 0
        let currentX = 0
        let active = false

        content.addEventListener('touchstart', e => {
          if (e.touches.length !== 1) return
          startX = e.touches[0].clientX
          active = true
          card.classList.add('swiping')
        }, { passive: true })

        content.addEventListener('touchmove', e => {
          if (!active) return
          currentX = e.touches[0].clientX - startX
          content.style.transform = 'translateX(' + currentX + 'px)'
          if (currentX > 30) card.dataset.swipeBg = 'applied'
          else if (currentX < -30) card.dataset.swipeBg = 'rejected'
          else card.dataset.swipeBg = ''
        }, { passive: true })

        content.addEventListener('touchend', () => {
          if (!active) return
          active = false
          card.classList.remove('swiping')
          if (currentX > 80) {
            commitStatus(row, 'Applied', card)
          } else if (currentX < -80) {
            commitStatus(row, 'Rejected', card)
          } else {
            content.style.transform = ''
            card.dataset.swipeBg = ''
          }
          currentX = 0
        })

        content.addEventListener('click', e => {
          if (Math.abs(currentX) > 5) return
          openRowDetail(row)
        })
      })
    }

    function commitStatus(row, status, card) {
      card.querySelector('.row-content').style.transform = 'translateX(' + (status === 'Applied' ? '100%' : '-100%') + ')'
      google.script.run
        .withSuccessHandler(() => {
          showToast('Marked ' + status.toLowerCase())
          loadAll()
        })
        .withFailureHandler(err => {
          showToast('Failed: ' + (err.message || err), true)
          card.querySelector('.row-content').style.transform = ''
          card.dataset.swipeBg = ''
        })
        .mobileSetStatus(row, status)
    }

    function openRowDetail(row) {
      if (!confirm('Score this row? (Re-runs the JD through Claude.)')) return
      showToast('Scoring...')
      google.script.run
        .withSuccessHandler(result => {
          showToast('Scored: ' + (result.fit_score || '?') + ' / 100')
          loadAll()
        })
        .withFailureHandler(err => showToast('Score failed: ' + (err.message || err), true))
        .mobileScoreRow(row)
    }

    function bindQuickLogForm() {
      const form = $('#quick-log-form')
      if (!form) return
      form.onsubmit = e => {
        e.preventDefault()
        const payload = {
          company: $('#ql-company').value.trim(),
          role: $('#ql-role').value.trim(),
          jd_link: $('#ql-jd').value.trim(),
          status: $('#ql-status').value,
          tags: $('#ql-tags').value.trim(),
          notes: $('#ql-notes').value.trim()
        }
        if (!payload.company) {
          showToast('Company is required', true)
          return
        }
        const submitBtn = form.querySelector('button[type="submit"]')
        submitBtn.disabled = true
        submitBtn.textContent = 'Saving to sheet'
        google.script.run
          .withSuccessHandler(result => {
            showToast('Saved row ' + result.row)
            form.reset()
            submitBtn.disabled = false
            submitBtn.textContent = 'Save application'
            setState({ tab: 'recent' })
            loadAll()
          })
          .withFailureHandler(err => {
            showToast('Save failed: ' + (err.message || err), true)
            submitBtn.disabled = false
            submitBtn.textContent = 'Save application'
          })
          .quickLogApplication(payload)
      }
    }

    document.addEventListener('DOMContentLoaded', loadAll)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadAll()
    })
  </script>
</body>
</html>
